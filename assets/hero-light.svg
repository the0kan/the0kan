  <text x="60" y="171" fill="#55677d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="500">Computer Engineering · AI Engineering</text>
  <text x="60" y="224" fill="#25364b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Building practical systems across data, models, APIs,</text>
  <text x="60" y="256" fill="#25364b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">and product interfaces.</text>

