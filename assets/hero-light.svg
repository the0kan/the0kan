<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Okan Ozkan - Computer Engineering and AI Engineering</title>
  <desc id="desc">A system map connecting data, models, APIs, and products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf3f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087F6B"/>
      <stop offset="1" stop-color="#6755D9"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#cdd8e4" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#c6d2df" stroke-width="2"/>
  <rect x="58" y="52" width="110" height="8" rx="4" fill="url(#accent)"/>

